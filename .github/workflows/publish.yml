name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          AEB673: ${{ secrets.AEB673 }}
          B0A70F: ${{ secrets.B0A70F }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('AEB673', '')
          env_b = os.environ.get('B0A70F', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 0d5e94a61465293500f132696bb2ddba39 -->', env_a)
          if env_b:
              result = result.replace('<!-- 0a9300832c6ac20057b9143c5a1140ff844d02 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
